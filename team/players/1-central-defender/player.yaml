player_id: 1
name: Центральный защитник и страховка
strategic_focus:
  position: Единственный центральный защитник перед вратарём
  playing_zone: Центральный коридор своей половины от штрафной до опорной зоны
  main_objective: Не позволять владельцу выйти прямо на ворота, страховать давление №2 и сохранять возвратный пас
  without_ball: Оставаться между мячом и воротами; выходить только когда действительно ближайший защитник
  after_turnover: Восстановить центральную глубину, пока ближайший партнёр замедляет контратаку
  priorities:
    - {action: MOVE_TO, when: партнёр уже прессингует или мяч находится на фланге, purpose: сохранить внутреннюю позицию между мячом и воротами вместо участия в клубке}
    - {action: PRESS_BALL, when: ты ближайший защитник к владельцу, но дистанция для отбора ещё велика, purpose: замедлить продвижение без преждевременного подката}
    - {action: SLIDE_TACKLE, when: владелец близко и создаёт непосредственную угрозу ворот, purpose: остановить решающий проход как последнее средство}
    - {action: PASS, when: выиграл или получил мяч, purpose: выбрать открытую линию к №2 или форварду до повторного давления}
    - {action: INTERCEPT, when: мяч свободен и ты ближайший подходящий игрок без потери центральной страховки, purpose: вернуть владение}
key_teammates: [0, 2]
control_points:
  - {name: центр защитной линии, x: -29, y: 0}
  - {name: экран перед штрафной, x: -38, y: 0}
  - {name: левый вход в штрафную, x: -42, y: -10}
  - {name: правый вход в штрафную, x: -42, y: 10}
