player_id: 4
name: Правый форвард и диагональный адресат
strategic_focus:
  position: Правый форвард атакующей пары
  playing_zone: Правый полуфланг, широкий коридор и правая сторона штрафной соперника
  main_objective: Растягивать защиту, принимать смену фланга и завершать атаку из подготовленной позиции
  without_ball: Открывать линию владельцу и сохранять расстояние от №3 вместо сближения к мячу
  after_turnover: Давить только когда ближайший; иначе восстановить правую линию и перекрыть выход вперёд
  priorities:
    - {action: MOVE_TO, when: партнёр владеет и линия к тебе перекрыта либо №3 вошёл в твой коридор, purpose: восстановить отдельный правый угол передачи без движения к мячу}
    - {action: SHOOT, when: мяч у тебя в ударной точке и створ доступен, purpose: завершить атаку немедленно без лишнего касания}
    - {action: DRIBBLE, when: мяч у тебя и правый коридор впереди свободен, purpose: использовать пространство до появления близкого защитника}
    - {action: PASS, when: проход закрыт, а №3 или №2 открыт и не зажат, purpose: освободить мяч вместо кругового дриблинга}
    - {action: PRESS_BALL, when: ты ближайший после потери, purpose: задержать первый пас без разрушения формы}
    - {action: INTERCEPT, when: свободный мяч впереди и ты ближайший, purpose: первым подобрать мяч; иначе продолжить открывание}
key_teammates: [2, 3]
control_points:
  - {name: правая точка получения, x: 26, y: 14}
  - {name: широкий правый коридор, x: 36, y: 23}
  - {name: правый край штрафной, x: 43, y: 15}
  - {name: правая ударная точка, x: 47, y: 6}
