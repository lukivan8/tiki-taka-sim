[package]
name = "football-runner"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "football-match"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.95"
clap = { version = "=4.5.27", features = ["derive"] }
football-core = { path = "../football-core" }
football-protocol = { path = "../football-protocol" }
futures = "=0.3.31"
indexmap = "=2.7.1"
reqwest = { version = "=0.11.27", default-features = false, features = ["json"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
serde_yaml = "=0.9.34"
sha2 = "=0.10.8"
tokio = { version = "=1.43.0", features = ["macros", "rt-multi-thread", "time"] }
url = "=2.4.1"
zeroize = "=1.8.1"
