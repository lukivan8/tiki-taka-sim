schemaVersion: afc-arena/v2
arenaVersion: nova-baseline-v2
replaySchemaVersion: afc-replay/v2
description: Canonical 60 Hz football simulation for the AWS Nova team.

# This is the single authoritative object for every gameplay/timing constant in
# The runner rejects unknown or missing keys so parameters cannot
# silently migrate back into implementation code.
simulationParameters:
  timing:
    physicsHz: 60
    durationSeconds: 120.0
    decisionIntervalSeconds: 2.0
    decisionDeadlineMs: 10000
  field:
    halfLength: 55.0
    halfWidth: 35.0
    goalHalfWidth: 3.66
    boundaryRestitution: 0.35
    playerBoundaryMargin: 0.65
  players:
    walkSpeed: 5.6
    runSpeed: 7.2
    sprintSpeed: 9.2
    acceleration: 14.0
    braking: 18.0
    idleVelocityRetentionPerSecond: 0.03
    targetStopDistance: 0.20
    physicalRadius: 0.62
    separationStrength: 0.72
    possessionBallOffset: 0.82
    attackingStanceSpeedFactor: 1.04
    defensiveStanceSpeedFactor: 0.96
  stamina:
    sprintThreshold: 0.08
    sprintDrainPerSecond: 0.085
    movingRecoveryPerSecond: 0.018
    idleRecoveryPerSecond: 0.055
    exhaustedSpeedFactor: 0.78
  ball:
    dragPerSecond: 0.42
    stopSpeed: 0.18
    controlRadius: 1.18
    intendedReceiverRadius: 1.42
    maxControlSpeed: 11.5
    maxIntendedReceiveSpeed: 23.0
    goalkeeperControlRadius: 2.15
    goalkeeperMaxControlSpeed: 26.0
    goalkeeperControlDepth: 16.5
    kickSeparation: 1.05
    kickerRecontrolSeconds: 0.48
    lostPossessionRecontrolSeconds: 0.18
    kickerVelocityRetention: 0.35
  goalkeeping:
    # Tactical commands still arrive every 2s; goalkeeper reactions are
    # evaluated on every 60Hz physics tick for shots and controlled close-downs.
    goalLineOffset: 5.0
    reactionDelaySeconds: 0.18
    maximumPredictionSeconds: 3.0
    minimumIncomingSpeed: 8.0
    lateralSpeed: 7.5
    acceleration: 22.0
    predictionMargin: 1.0
    maximumLateralPosition: 4.2
    controlledBallChallengeSeconds: 0.12
    controlledBallStandOffDistance: 1.2
    maximumRushDistance: 12.0
  passing:
    normalSpeed: 18.0
    throughSpeed: 22.0
    aerialSpeed: 24.0
    goalkeeperThrowSpeed: 14.0
    goalkeeperKickSpeed: 23.0
    targetLeadSeconds: 0.32
    minimumTravelDistance: 2.2
  shooting:
    baseSpeed: 28.0
    minimumPower: 0.25
    maximumPower: 1.0
    targetLeftY: -3.05
    targetRightY: 3.05
    targetDepth: 1.0
  clearances:
    speed: 24.0
    lateralBias: 0.28
  defending:
    defaultPressIntensity: 0.7
    sprintPressThreshold: 0.65
    tightMarkDistance: 1.7
    looseMarkDistance: 3.8
    minimumMarkDistance: 1.0
    maximumMarkDistance: 8.0
    interceptLookaheadSeconds: 0.32
    tackleMinimumReach: 1.15
    tackleMaximumReach: 2.15
    tackleBallReleaseSpeed: 4.5
    tackleRecoverySeconds: 0.35
    failedTackleRecoverySeconds: 0.65
    pressChallengeRadius: 1.55
    pressChallengeSeconds: 0.30
    pressBallReleaseSpeed: 3.8
  formation:
    defaultPreset: 1-1-2
    presets:
      1-1-2:
        label: 1-1-2 · two forwards
        description: One defender, one pivot, and two wide forwards.
        coordinates:
          - { playerId: 0, x: -50.0, y: 0.0 }
          - { playerId: 1, x: -30.0, y: 0.0 }
          - { playerId: 2, x: -18.0, y: 0.0 }
          - { playerId: 3, x: -7.0, y: -13.0 }
          - { playerId: 4, x: -7.0, y: 13.0 }
      1-2-1:
        label: 1-2-1 · diamond
        description: One defender, two wide midfielders, and one forward.
        coordinates:
          - { playerId: 0, x: -50.0, y: 0.0 }
          - { playerId: 1, x: -31.0, y: 0.0 }
          - { playerId: 2, x: -17.0, y: -13.0 }
          - { playerId: 3, x: -17.0, y: 13.0 }
          - { playerId: 4, x: -6.0, y: 0.0 }
      2-1-1:
        label: 2-1-1 · balanced
        description: Two defenders, one central pivot, and one forward.
        coordinates:
          - { playerId: 0, x: -50.0, y: 0.0 }
          - { playerId: 1, x: -31.0, y: -12.0 }
          - { playerId: 2, x: -31.0, y: 12.0 }
          - { playerId: 3, x: -16.0, y: 0.0 }
          - { playerId: 4, x: -6.0, y: 0.0 }
      2-2-0:
        label: 2-2-0 · square
        description: Two defenders and two midfielders without a fixed forward.
        coordinates:
          - { playerId: 0, x: -50.0, y: 0.0 }
          - { playerId: 1, x: -31.0, y: -11.0 }
          - { playerId: 2, x: -31.0, y: 11.0 }
          - { playerId: 3, x: -10.0, y: -14.0 }
          - { playerId: 4, x: -10.0, y: 14.0 }
      3-1:
        label: 3-1 · low block
        description: Three-player defensive line and one central forward.
        coordinates:
          - { playerId: 0, x: -50.0, y: 0.0 }
          - { playerId: 1, x: -32.0, y: -15.0 }
          - { playerId: 2, x: -33.0, y: 0.0 }
          - { playerId: 3, x: -32.0, y: 15.0 }
          - { playerId: 4, x: -7.0, y: 0.0 }
      1-3:
        label: 1-3 · high line
        description: One defender and a wide three-player attacking line.
        coordinates:
          - { playerId: 0, x: -50.0, y: 0.0 }
          - { playerId: 1, x: -31.0, y: 0.0 }
          - { playerId: 2, x: -10.0, y: -17.0 }
          - { playerId: 3, x: -8.0, y: 0.0 }
          - { playerId: 4, x: -10.0, y: 17.0 }
      1-1-1-2-high:
        label: Nova 1-1-1-2 high
        description: Same shape with both forwards pushed level with the kickoff spot.
        coordinates:
          - { playerId: 0, x: -50.0, y: 0.0 }
          - { playerId: 1, x: -29.0, y: 0.0 }
          - { playerId: 2, x: -3.0, y: 0.0 }
          - { playerId: 3, x: -2.0, y: -14.0 }
          - { playerId: 4, x: -2.0, y: 14.0 }
    awayMirrorX: true
    awayMirrorY: true
  rules:
    initialKickoffTeam: 0
    kickoffPlayerId: 2
    kickoffPlayerXOffset: 0.9

commandVocabulary:
  - MOVE_TO
  - DRIBBLE
  - PASS
  - SHOOT
  - CLEAR
  - GK_DISTRIBUTE
  - PRESS_BALL
  - MARK
  - INTERCEPT
  - SLIDE_TACKLE
  - IDLE
fallback:
  command: IDLE
  conditions: [timeout, http_error, malformed_response, invalid_command]
