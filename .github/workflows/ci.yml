name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests
        run: cargo test --workspace
      - name: Python syntax
        run: python3 -m py_compile tools/*.py
      - name: Shell syntax
        run: bash -n scripts/*.sh
