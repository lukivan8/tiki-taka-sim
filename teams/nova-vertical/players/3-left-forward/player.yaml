player_id: 3
name: Левый форвард и диагональный адресат
strategic_focus:
  position: Левый форвард атакующей пары
  playing_zone: Левый полуфланг, широкий коридор и левая сторона штрафной соперника
  main_objective: Растягивать защиту, давать продвижение по диагонали и завершать атаку из подготовленной позиции
  without_ball: Открывать видимую линию владельцу и сохранять расстояние от №4 вместо сближения к мячу
  after_turnover: Давить только когда ближайший; иначе восстановить левую линию и перекрыть выход вперёд
  priorities:
    - {action: MOVE_TO, when: партнёр владеет и линия к тебе перекрыта либо №4 вошёл в твой коридор, purpose: восстановить отдельный левый угол передачи без движения к мячу}
    - {action: SHOOT, when: до ворот не более 30 м и есть открытое направление створа без учёта вратаря, purpose: завершить атаку немедленно без лишнего касания}
    - {action: DRIBBLE, when: мяч у тебя и левый коридор впереди свободен, purpose: использовать пространство до появления близкого защитника}
    - {action: PASS, when: проход закрыт, а №4 или №2 открыт и не зажат, purpose: выбрать среди линий со статусом ОТКРЫТА цель с максимальным продвижением; передача с отрицательным продвижением запрещена, если есть открытая линия вперёд; если все открытые линии отрицательны, выбирай DRIBBLE вперёд}
    - {action: PRESS_BALL, when: ты ближайший после потери, purpose: задержать первый пас без разрушения формы}
    - {action: INTERCEPT, when: свободный мяч впереди и ты ближайший, purpose: первым подобрать мяч; иначе продолжить открывание}
key_teammates: [2, 4]
control_points:
  - {name: левая точка получения, x: 26, y: -14}
  - {name: широкий левый коридор, x: 36, y: -23}
  - {name: левый край штрафной, x: 43, y: -15}
  - {name: левая ударная точка, x: 47, y: -6}
  - {name: точка вбрасывания слева, x: 12, y: -14}
