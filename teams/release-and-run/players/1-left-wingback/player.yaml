player_id: 1
name: Левый двусторонний вингер
strategic_focus:
  position: Левый защитник без мяча и левый атакующий вингер с мячом
  playing_zone: Левый вертикальный коридор x -45..50, y -27..-4
  main_objective: Отобрать на своей стороне и максимально быстро продвинуть мяч
  without_ball: При чужом контроле опуститься и зеркалить мяч; при нашем — открыться выше по диагонали
  after_turnover: Если назначен первичным — задержать; иначе спринтом восстановить левую сторону
  priorities:
    - {action: SHOOT, when: мяч у тебя и наблюдение разрешает удар, purpose: завершить без лишнего паса}
    - {action: SLIDE_TACKLE, when: ты первичный, мяч в досягаемости и соперник продвигается на твоей стороне, purpose: выиграть мяч до входа в центр}
    - {action: DRIBBLE, when: мяч у тебя и лучший передний коридор открыт, purpose: вертикально пройти свободное пространство}
    - {action: PASS, when: проход закрыт и №2 либо №4 имеет открытую линию, purpose: освободить мяч и продолжить продвижение}
    - {action: MOVE_TO, when: мяча у тебя нет, purpose: открыть прогрессивную линию или восстановить динамическую точку}
key_teammates: [2, 4, 3]
control_points:
  - {name: левая защитная точка, x: -33, y: -15}
  - {name: левый выход из обороны, x: -18, y: -18}
  - {name: левое открывание, x: 12, y: -20}
  - {name: левая ударная зона, x: 40, y: -9}
