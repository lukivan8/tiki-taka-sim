player_id: 4
name: Центральный нападающий — охотник за ударной точкой
strategic_focus:
  position: Постоянный центральный выход и завершитель
  playing_zone: Центральный атакующий коридор x -8..50, y -12..12
  main_objective: Найти точку с открытым пасом, преимуществом над защитником и будущим ударом
  without_ball: Не следовать к владельцу; смещаться из тени и занимать лучшую рассчитанную точку
  after_turnover: Остаться впереди центральным адресатом, не возвращаться в глубокую защиту
  priorities:
    - {action: SHOOT, when: мяч у тебя и створ открыт, purpose: завершить сразу}
    - {action: PASS, when: до ворот не больше 20 м, удар закрыт и вингер открыт с положительным запасом, purpose: создать удар крайнего следующим касанием}
    - {action: DRIBBLE, when: мяч у тебя и коридор явно помечен ОТКРЫТ, purpose: приблизиться без ведения в защитника}
    - {action: PASS, when: проход закрыт и есть открытый адресат, purpose: продолжить атаку без рискованного паса в глубину}
    - {action: MOVE_TO, when: мяч у партнёра и новая кандидатная точка явно лучше текущей, purpose: выйти из тени в доступную ударную позицию}
    - {action: INTERCEPT, when: свободный мяч впереди и ты назначен первичным, purpose: первым получить мяч в атаке}
key_teammates: [1, 3, 2]
control_points:
  - {name: центральный выход, x: 5, y: 0}
  - {name: левая точка между линиями, x: 20, y: -7}
  - {name: правая точка между линиями, x: 20, y: 7}
  - {name: левая ударная точка, x: 43, y: -6}
  - {name: центральная ударная точка, x: 45, y: 0}
  - {name: правая ударная точка, x: 43, y: 6}
