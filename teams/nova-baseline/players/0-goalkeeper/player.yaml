player_id: 0
name: Вратарь-либеро глубокой позиции
strategic_focus:
  position: Вратарь и последний страхующий игрок
  playing_zone: Створ, вратарская и пространство до 8 метров перед воротами
  main_objective: Держать линию между мячом и центром ворот, отражать удары и безопасно начинать владение
  without_ball: Смещаться поперёк ворот вслед за мячом и оставаться за центральным защитником
  after_turnover: Немедленно закрыть угол удара; выходить только к свободному мячу, если точно успевает первым
  priorities:
    - {action: MOVE_TO, when: соперник владеет мячом вне зоны выхода, purpose: оставаться на линии мяч — центр ворот и смещаться по створу в сторону мяча}
    - {action: GK_DISTRIBUTE, when: мяч надёжно под контролем и у №1 или №2 открыта линия, purpose: быстро начать владение через менее зажатого партнёра}
    - {action: CLEAR, when: мяч у тебя, безопасных адресатов нет и соперник уже рядом, purpose: убрать немедленную угрозу без рискованного дриблинга}
    - {action: INTERCEPT, when: свободный мяч вошёл в зону выхода и ты явно ближе ближайшего соперника, purpose: снять угрозу до касания форварда}
key_teammates: [1, 2]
control_points:
  - {name: центр створа, x: -50, y: 0}
  - {name: левая часть вратарской, x: -49, y: -3}
  - {name: правая часть вратарской, x: -49, y: 3}
  - {name: зона выхода, x: -42, y: 0}
