player_id: 2
name: Связующий полузащитник и первый прессинг
strategic_focus:
  position: Центральный полузащитник между защитником и двумя форвардами
  playing_zone: Центральная треть и оба полуфланга без бессмысленного преследования до ворот
  main_objective: Связывать линии передачей, открывать новый угол владельцу и первым замедлять центральный переход
  without_ball: Давать диагональную линию передачи и не стоять на одной оси с владельцем и защитником
  after_turnover: Если ближайший — замедлить владельца; иначе вернуться между мячом и №1
  priorities:
    - {action: MOVE_TO, when: мяч у №0 или №1 либо линия владельца к тебе перекрыта, purpose: сместиться с общей оси и открыть диагональный угол}
    - {action: DRIBBLE, when: мяч у тебя и коридор впереди действительно свободен, purpose: пройти свободный участок без обязательства продолжать ведение на следующем тике}
    - {action: PASS, when: коридор дриблинга закрылся или партнёр заметно свободнее, purpose: выбрать открытую линию к №3, №4 или возврат к №1 до контакта}
    - {action: SHOOT, when: мяч у тебя в ударной зоне и створ доступен, purpose: завершить атаку без лишней передачи}
    - {action: PRESS_BALL, when: ты ближайший после потери, purpose: задержать соперника, пока остальные восстанавливают структуру}
    - {action: INTERCEPT, when: мяч свободен в центре и ты ближайший, purpose: подобрать мяч без сбора нескольких партнёров в одной точке}
key_teammates: [1, 3, 4]
control_points:
  - {name: центральная опорная точка, x: -3, y: 0}
  - {name: левый полуфланг, x: 10, y: -10}
  - {name: правый полуфланг, x: 10, y: 10}
  - {name: зона второго мяча, x: 32, y: 0}
