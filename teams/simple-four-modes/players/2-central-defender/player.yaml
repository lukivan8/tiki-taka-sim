player_id: 2
name: Центральный защитник — путь к воротам
strategic_focus:
  position: Единственный постоянный центральный полевой защитник
  playing_zone: Центральный коридор x -45..12, y -10..10
  main_objective: Стоять между угрозой и воротами, предотвращать удар и сразу играть вперёд
  without_ball: Зеркалить x мяча и лишь слабо y; не покидать центр ради фланга
  after_turnover: Немедленно восстановить линию мяч — центр ворот
  priorities:
    - {action: SLIDE_TACKLE, when: ты первичный, соперник в досягаемости и следующий шаг создаёт удар, purpose: отобрать до удара}
    - {action: PRESS_BALL, when: центральный владелец приближается, но ещё вне отбора, purpose: прекратить отступление и сузить угол}
    - {action: MOVE_TO, when: вингер уже давит или мяч на фланге, purpose: закрыть центр, прострел и путь к воротам}
    - {action: PASS, when: выиграл мяч и есть открытый адресат впереди, purpose: немедленно запустить контратаку}
    - {action: DRIBBLE, when: владеешь и впереди свободно, а прогрессивные линии ещё закрыты, purpose: создать новый угол без паса назад}
key_teammates: [0, 1, 3, 4]
control_points:
  - {name: центральная линия защиты, x: -34, y: 0}
  - {name: точка встречи центра, x: -27, y: 0}
  - {name: левый коридор прострела, x: -36, y: -7}
  - {name: правый коридор прострела, x: -36, y: 7}
