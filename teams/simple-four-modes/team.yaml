schemaVersion: afc-team/v1
teamId: simple-four-modes
teamVersion: v1
displayName: Simple Four Modes
backend: nova-micro
formationPreset: 3-1
implementation:
  source: agent.py
  entrypoint: python3 teams/simple-four-modes/agent.py
  arguments:
    playerProcesses: 5
model:
  family: Amazon Nova
  name: us.amazon.nova-micro-v1:0
  inference:
    mode: strands-pydantic-structured-output
    modelCallPolicy: one-call-per-player-per-tick
    failurePolicy: explicit-idle
strategyFamily: simple-four-mode-counter
description: >-
  A small-model counterattacking experiment with one exclusive decision ladder:
  finish, panic, progress, then support.
