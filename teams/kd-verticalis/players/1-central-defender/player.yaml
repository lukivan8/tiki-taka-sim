player_id: 1
name: Центральный защитник и первый пас
strategic_focus:
  position: Единственный центральный защитник перед вратарём
  playing_zone: Центральный коридор своей половины от штрафной до опорной зоны
  main_objective: Не пускать соперника в его забивной карман и начинать атаку вертикальным пасом
  without_ball: Оставаться между мячом и воротами; идти в отбор, как только он доступен
  after_turnover: Перекрыть центральный проход и вступить в отбор, как только соперник в досягаемости
  priorities:
  - action: MOVE_TO
    when: партнёр уже прессингует или мяч на фланге
    purpose: сохранить внутреннюю позицию между мячом и воротами вместо участия в клубке
  - action: PRESS_BALL
    when: PRESS_BALL доступен, а дистанция для отбора ещё велика
    purpose: замедлить продвижение без преждевременного подката
  - action: SLIDE_TACKLE
    when: владелец близко и уже входит в свой забивной карман
    purpose: разорвать атаку до удара, который не берётся вратарём
  - action: PASS
    when: выиграл или получил мяч
    purpose: сразу отдать №2 или вертикально форварду; безопасный пас поперёк не создаёт угрозы
  - action: INTERCEPT
    when: INTERCEPT доступен и выход не оголяет центр
    purpose: вернуть владение
