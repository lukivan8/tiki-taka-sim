player_id: 2
name: Вертикальный связующий и поставщик карманов
strategic_focus:
  position: Центральный полузащитник между защитником и двумя форвардами
  playing_zone: Центральная треть и оба полуфланга до линии карманов
  main_objective: Доставлять мяч в один из двух забивных карманов кратчайшим числом касаний
  without_ball: Держать диагональ к обоим карманам и не стоять на одной оси с владельцем
  after_turnover: Если PRESS_BALL доступен — замедлить владельца; иначе вернуться между мячом и №1
  priorities:
  - action: SHOOT
    when: SHOOT есть в доступных командах
    purpose: удар уже проверен моделью — бей ЛУЧШИМ НАПРАВЛЕНИЕМ с power 1.0
  - action: PASS
    when: линия к форварду в кармане открыта
    purpose: доставить мяч туда, откуда удар забивает; THROUGH если адресат бежит в карман
  - action: DRIBBLE
    when: коридор вперёд свободен и пас в карман пока закрыт
    purpose: продвинуть мяч ближе к линии карманов
  - action: MOVE_TO
    when: мяч у №0 или №1 либо твоя линия перекрыта
    purpose: сместиться с общей оси и открыть диагональ к карману
  - action: PRESS_BALL
    when: PRESS_BALL есть в доступных командах
    purpose: задержать соперника, пока восстанавливается структура
  - action: INTERCEPT
    when: INTERCEPT доступен и мяч свободен в центре
    purpose: подобрать мяч без сбора партнёров в одной точке
