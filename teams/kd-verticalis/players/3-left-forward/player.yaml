player_id: 3
name: Левый форвард и владелец левого кармана
strategic_focus:
  position: Левый форвард атакующей пары
  playing_zone: Левый полуфланг и левый забивной карман около (44, -12)
  main_objective: Занять левый карман и завершить атаку ударом, который модель уже признала забивающим
  without_ball: Держать левый карман открытым и отдельным от №4; открывать линию, а не бежать к мячу
  after_turnover: Давить, как только PRESS_BALL доступен; иначе оставаться высоко как выход для контратаки
  priorities:
  - action: SHOOT
    when: SHOOT есть в доступных командах
    purpose: удар уже проверен моделью вратаря и забивает — бей ЛУЧШИМ НАПРАВЛЕНИЕМ с power 1.0 и не ищи
      позицию лучше
  - action: DRIBBLE
    when: мяч у тебя, забивающего удара нет, а коридор к левому карману свободен
    purpose: довести мяч в карман, откуда удар начнёт забивать
  - action: MOVE_TO
    when: мяча у тебя нет
    purpose: занять левый карман (44, -12) или восстановить отдельную от №4 левую ширину
  - action: PASS
    when: проход закрыт, а №4 или №2 заметно свободнее
    purpose: сменить фланг на второй карман вместо кругового дриблинга
  - action: PRESS_BALL
    when: PRESS_BALL есть в доступных командах
    purpose: задержать первый пас соперника
  - action: INTERCEPT
    when: INTERCEPT доступен и мяч свободен впереди
    purpose: подобрать мяч в атакующей трети
