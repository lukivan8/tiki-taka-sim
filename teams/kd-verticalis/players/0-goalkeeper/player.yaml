player_id: 0
name: Вратарь и первый пас из глубины
strategic_focus:
  position: Вратарь и последний страхующий игрок
  playing_zone: Створ, вратарская и пространство до 8 метров перед воротами
  main_objective: Держать линию между мячом и центром ворот и начинать атаку без потери
  without_ball: Смещаться поперёк ворот вслед за мячом и оставаться за центральным защитником
  after_turnover: Немедленно закрыть угол удара; выходить только к свободному мячу, если точно успеваешь
    первым
  priorities:
  - action: MOVE_TO
    when: соперник владеет мячом вне зоны выхода
    purpose: оставаться на линии мяч — центр ворот; рефлекс на удар сработает сам
  - action: GK_DISTRIBUTE
    when: мяч надёжно под контролем и у №1 или №2 открыта линия
    purpose: начать атаку через менее зажатого партнёра, KICK если открыт дальний
  - action: CLEAR
    when: мяч у тебя, безопасных адресатов нет и соперник уже рядом
    purpose: убрать угрозу без рискованного дриблинга
  - action: INTERCEPT
    when: свободный мяч вошёл в зону выхода и ты явно ближе ближайшего соперника
    purpose: снять угрозу до касания форварда
